- name: '@onprem-ai/dsh-llm'
- name: '@onprem-ai/dsh-session'
- name: '@onprem-ai/dsh-session-projection'
- name: '@onprem-ai/dsh-system-prompt'
- name: '@onprem-ai/dsh-tools'
- name: '@onprem-ai/dsh-agent'
- name: '@onprem-ai/dsh-agent-loop'
  config:
    agents: []
- name: '@onprem-ai/dsh-credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@onprem-ai/dsh-llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@onprem-ai/dsh-llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
