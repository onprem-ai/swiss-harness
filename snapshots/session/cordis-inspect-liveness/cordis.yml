- id: agent-default-model
  name: '@onprem-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@onprem-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@onprem-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@onprem-ai/dsh-tools'
  config:
    mode: native

- id: system-prompt
  name: '@onprem-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@onprem-ai/dsh-cordis-host-runner'
      config:
        clientInspectTimeoutMs: 100
    - id: cordis-inspect-providers
      name: '@onprem-ai/dsh-tool-cordis/host'
    - id: tool-cordis
      name: '@onprem-ai/dsh-tool-cordis'
    - id: client-inspect-liveness-fixture
      name: ./client-fixture.mjs
