# Native inspection, scoped PTC, then native subagents and workflow.
- id: llm-deepseek
  name: '@onprem-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@onprem-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@onprem-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@onprem-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@onprem-ai/dsh-tools'
  config:
    mode: native

- id: system-prompt
  name: '@onprem-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@onprem-ai/dsh-cordis-host-runner'
    - id: cordis-inspect-providers
      name: '@onprem-ai/dsh-tool-cordis/host'
    - id: tool-cordis
      name: '@onprem-ai/dsh-tool-cordis'
    - id: llm-replay
      name: '@onprem-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: advanced-toolchain-presentation
      name: './presentation.mjs'
