# Keyless replay counterpart to pty.cordis.yml.
- id: llm-deepseek
  name: '@onprem-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: pty
      name: '@onprem-ai/dsh-terminal'
    - id: pty-snapshot-backend
      name: './pty-snapshot-backend.mjs'
    - id: tool-terminal
      name: '@onprem-ai/dsh-tool-terminal'
      config:
        maxResultBytes: 64
    - id: llm-replay
      name: '@onprem-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: plugin-package-inventory-deepseek
  disabled: true
